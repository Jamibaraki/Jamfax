<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamfax Dashboard</title>

<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem;
    }

    .dashboard {
      width: 100%;
      max-width: 420px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.4);
      border: 1px solid #334155;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .card-header img {
      width: 64px;
      height: 64px;
    }

    .temperature {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
    }

    .summary {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-top: 0.25rem;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid #334155;
    }

    .detail {
      text-align: center;
    }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 0.25rem;
    }

    .detail-value {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .status {
      text-align: center;
      color: #94a3b8;
      padding: 2rem;
    }

    .error {
      color: #f87171;
    }
  </style>


  
</head>
<body>
<script src="config.js"></script>
<script src="main.js"></script>


<div class="dashboard">
  <div id="weather-card" class="card">
    <div class="status">Loading weather…</div>
  </div>
</div>






<textarea id="target" cols="50" rows="10">
  Waiting for data..
</textarea>








</body>
</html>
